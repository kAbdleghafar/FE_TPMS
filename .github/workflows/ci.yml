name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages (CalculiX reference solver, Gmsh runtime libs)
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx libglu1-mesa libxcursor1 libxinerama1 libxft2
      - run: pip install -e ".[dev]"
      - run: pytest -q
